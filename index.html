  <!-- Arranque (docs/PULIDO.md §27): estilos en línea para que el primer fotograma ya sea la pantalla de Entreno,
       sin esperar a las hojas de estilo. El fondo es el de la app (#0b0d10 = --bg, theme-color y manifest). -->
  <style>
    html, body { background: #0b0d10; }
    #splash { position: fixed; inset: 0; z-index: 2147483000; background: #0b0d10; display: flex; flex-direction: column;
      align-items: center; justify-content: center; transition: opacity 220ms cubic-bezier(.4, 0, .2, 1); touch-action: none; }
    #splash .splash-mark { width: 84px; height: 84px; display: block; animation: splash-in 260ms cubic-bezier(.2, .8, .2, 1) both; }
    #splash .splash-by { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 32px); text-align: center;
      font: 500 13px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; color: #6b7280;
      letter-spacing: .01em; animation: splash-fade 260ms 120ms cubic-bezier(.2, .8, .2, 1) both; }
    #splash.splash-out { opacity: 0; pointer-events: none; }
    @keyframes splash-in { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
    @keyframes splash-fade { from { opacity: 0; } to { opacity: 1; } }
    /* Abierta desde la pantalla de inicio de iOS: su imagen de arranque ya enseña el logo en el mismo sitio; sin animación
       de entrada (no parpadea). Movimiento reducido: estática, y salida casi instantánea. */
    .splash-static #splash * { animation: none !important; }
    /* Reabierta a los pocos minutos de usarla (iOS recarga la página al desbloquear): sin bienvenida, directo a la app.
       La decisión se toma en el script de abajo, antes del primer fotograma, para que ni siquiera parpadee. */
    .splash-skip #splash { display: none; }
    @media (prefers-reduced-motion: reduce) { #splash * { animation: none !important; } #splash { transition-duration: 60ms; } }
  </style>
  <script>
    // Momento en que la pantalla de arranque es visible (la duración mínima cuenta desde aquí) y si viene de la
    // pantalla de inicio de iOS (entonces su imagen de arranque ya enseña el logo: sin animación de entrada).
    window.__boot = { t0: performance.now() };
    if (navigator.standalone) document.documentElement.classList.add('splash-static');
  </script>
