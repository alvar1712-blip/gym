name: CI

# Repositorio público: minutos de Actions gratuitos. Aun así, solo lo necesario.
# Las pruebas E2E (Playwright) son manuales: lanzar desde Actions > CI > Run workflow.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: "Ejecutar también las pruebas E2E (Chromium)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm run check

  e2e:
    if: inputs.e2e
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm i -g playwright && npx playwright install --with-deps chromium
      - run: npm run e2e
